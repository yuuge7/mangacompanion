# Analyzer and lint settings. `flutter analyze` must pass with no issues;
# CI runs it before every release build.
#
# On top of flutter_lints: strict typing (no implicit dynamic or casts),
# futures that are neither awaited nor marked `unawaited`, and a set of
# readability rules. To silence one case, prefer fixing it; failing that,
# use `// ignore: rule_name` on that line with a reason.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Treat these as errors, not hints: each one is a likely bug.
    unawaited_futures: error
    unused_import: error
    unused_local_variable: error
    dead_code: error

linter:
  rules:
    # Correctness
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - only_throw_errors
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_statements

    # Readability
    - avoid_redundant_argument_values
    - directives_ordering
    - missing_whitespace_between_adjacent_strings
    - noop_primitive_operations
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_relative_imports
    - prefer_single_quotes
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - use_named_constants
