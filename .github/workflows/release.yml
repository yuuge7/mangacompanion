name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      # path_provider_android pulls in jni, which compiles native code, so the
      # build needs the NDK and CMake that Flutter 3.44.8 pins. Runners do not
      # ship every NDK version and AGP's own download of it is unreliable, so
      # install them explicitly. Bump these together with flutter-version.
      - name: Install Android NDK and CMake
        run: sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is empty. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      # Gradle only touches the keystore at packaging time, minutes into the
      # build, and reports mismatches as an opaque failure. Check it up front.
      - name: Check keystore secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore android/app/upload-keystore.jks \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD or KEY_ALIAS does not match the keystore in KEYSTORE_BASE64."
            exit 1
          fi

      - name: Compute next version
        id: version
        run: |
          LATEST=$(git tag -l 'v1.*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            NEXT=0
          else
            NEXT=$(( ${LATEST#v1.} + 1 ))
          fi
          echo "version=1.$NEXT" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --build-name=${{ steps.version.outputs.version }} --build-number=${{ github.run_number }}

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "MangaCompanion-v${{ steps.version.outputs.version }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: MangaCompanion v${{ steps.version.outputs.version }}
          files: MangaCompanion-v${{ steps.version.outputs.version }}.apk
